services:
  postgres:
    image: postgres:16-alpine
    container_name: petals-postgres
    restart: always
    environment:
      POSTGRES_USER: petals_admin
      POSTGRES_PASSWORD: petals_password
      POSTGRES_DB: petals_erp
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U petals_admin -d petals_erp']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: petals-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:-petals_redis_dev}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-petals_redis_dev}

volumes:
  postgres_data:
  redis_data:
