version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: petals-postgres
    restart: always
    environment:
      POSTGRES_USER: petals_admin
      POSTGRES_PASSWORD: petals_password
      POSTGRES_DB: petals_erp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U petals_admin -d petals_erp']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: petals-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

