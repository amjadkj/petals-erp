name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petals_admin
          POSTGRES_PASSWORD: petals_password
          POSTGRES_DB: petals_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm --filter @petals/api db:generate
        env:
          DATABASE_URL: postgresql://petals_admin:petals_password@localhost:5432/petals_erp?schema=public

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Run database migrations
        run: pnpm --filter @petals/api db:migrate:deploy
        env:
          DATABASE_URL: postgresql://petals_admin:petals_password@localhost:5432/petals_erp?schema=public

      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://petals_admin:petals_password@localhost:5432/petals_erp?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-minimum-length-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-minimum-length-32-chars
          COOKIE_SECRET: test-cookie-secret-minimum-length-32-chars

